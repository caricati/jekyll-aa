{% assign meses = "janeiro,fevereiro,março,abril,maio,junho,julho,agosto,setembro,outubro,novembro,dezembro" | split: "," %}
{% assign mes = include.date | date: "%m" | minus: 1 %}

<time datetime="{{ include.date | date: "%Y-%m-%d" }}">{{ include.date | date: "%d" }} de {{ meses[mes] }} de {{ include.date | date: "%Y" }}</time>
