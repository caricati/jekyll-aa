{% if site.posts.size > 1 %}
  <section class="list-section">
    <div class="max-container">
      <h2 class="heading-bars">
        {% if include.title %}
          {{ include.title }}
        {% else %}
          últimas novidades
        {% endif %}
      </h2>
      <div class="grid">
        {% for post in site.posts limit:4 %}
          <article>
            <figure class="photo-figure">
              <a href="{{ post.url }}">
                <img src="{{ post.thumb }}" alt="{{ post.title }}" />
                <div class="category">{% include get-category.html category=post.categories.first %}</div>
              </a>
            </figure>
            <div class="inner">
              <h3>
                <a href="{{ post.url }}">{{ post.title }}</a>
              </h3>
              {% include date.html date=post.date %}
            </div>
          </article>
        {% endfor %}
      </div>
    </div>
  </section>
{% endif %}
